[build]
  base = "frontend"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy API requests to Node backend in production
[[redirects]]
  from = "/api/*"
  to = "https://YOUR_BACKEND_URL/api/:splat"
  status = 200
  force = true

[context.production.environment]
  NEXT_PUBLIC_API_URL = "https://YOUR_BACKEND_URL"

# Bind these in Netlify UI → Site settings → Environment variables:
# MONGO_URI          — MongoDB connection string (backend-node)
# JWT_SECRET         — Secret for signing JWT tokens (backend-node)
# FLASK_API_URL      — URL of Flask AI service (backend-node → backend-flask)
# NEXT_PUBLIC_API_URL — Public URL of Express API (frontend)
