# netlify.toml
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # 🔴 IMPORTANT: Set this in Netlify UI, not here (it's public)
  # NEXT_PUBLIC_API_URL will be set in Netlify environment variables

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ✅ Redirect API requests to Node backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# ✅ Catch-all for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Production Environment Variables
[context.production.environment]
  # This should be your Express backend URL (set in Netlify UI)
  NEXT_PUBLIC_API_URL = "https://your-express-backend.railway.app"

# Development/Preview Environment
[context.deploy-preview.environment]
  NEXT_PUBLIC_API_URL = "http://localhost:5000"
